services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dollas
      POSTGRES_PASSWORD: dollas
      POSTGRES_DB: dollas
    ports:
      - "5432:5432"
    volumes:
      - dollas_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql

volumes:
  dollas_pg:
